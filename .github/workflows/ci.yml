# One required path on every push, and everything slow once a night.
#
#   build  compiles the app and both test bundles for the simulator (about three minutes) and
#          hands the products to the test jobs.
#   unit   every pull request and push to main. The only required check. Leaves out the suites
#          that call real OpenAI and, except at night, the fourteen slow tests
#          (TestHost.runsSlowTests: seeds, 300-node simulations, timing budgets).
#   live   the suites that call real OpenAI, with the key. Nightly, on a PR's "live" label, and
#          by hand. They judge a live model's answers, which vary from call to call.
#   ui     the UI suite in three shards. Nightly, on a PR's "ui" label, and by hand. Each shard
#          asks scripts/ci/ui-shards.sh for its tests, balanced by measured time.
#
# A pull request's run is build then unit. live and ui used to ride along (live after unit on
# every run, ui on every push to main), which made every run about twenty minutes and had each
# merge hold four of the account's five macOS runners for twenty more, queueing every pull
# request behind it. The measurements are in tasks/ci-speed.md.
#
# At night live and ui are not continue-on-error, so a failure turns the run red and GitHub emails
# about it. From a label or by hand they stay advisory. The nightly run is skipped when main has
# not moved since the last one that passed.
#
# Why one build and not one per job: each job building for itself while its simulator booted in
# the background was tried, and the boot fought the compiler for the runner's three cores, so
# builds took 6.5 to 11.5 minutes instead of 4.
#
# A manual run with "only" set (for example "PageOrderUITests/testScanReorderRemoveAndConfirmPages",
# several separated by spaces) skips unit and runs just those UI tests on one runner.
#
# The scripts under scripts/ci are the same ones that run in a terminal here.

name: CI

on:
  # No "labeled": a label-only run would skip its jobs, a skipped job counts as a passed required
  # check, and Dependabot labels every PR it opens. The "ui" and "live" labels work through
  # ui-label.yml.
  pull_request:
  push:
    branches: [main]
  schedule:
    # 07:00 UTC, three in the morning Eastern.
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      ui:
        description: Run the UI suite
        type: boolean
        default: true
      live:
        description: Run the live OpenAI suites
        type: boolean
        default: true
      slow:
        description: Include the slow unit tests
        type: boolean
        default: true
      skip_unit:
        description: Skip the unit job (ui-label.yml sets this; the PR's own run has it)
        type: boolean
        default: false
      only:
        description: "Run only these UI tests (Class or Class/testMethod, space-separated); skips unit"
        type: string
        default: ""

# A new run cancels the one in flight with the same event and ref: a push to a pull request
# cancels that PR's older run (its merge ref), a push to main cancels main's older run, and a
# re-dispatched label run cancels the one before it. The event is in the group so a push to main
# never cancels the nightly run, and a PR's own run never cancels its label run.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODE_VERSION: "26.6"
  UI_SHARDS: 3
  MINDLORE_SIM_NAME: iPhone 17
  MINDLORE_SIM_OS: "26.5"
  MINDLORE_DERIVED_DATA: ${{ github.workspace }}/build/DerivedData
  MINDLORE_RESULTS: ${{ github.workspace }}/build/results

jobs:
  # Nightly only: nothing to do when main is where the last passing nightly run left it.
  nightly-gate:
    name: Anything new on main
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --event schedule \
            --branch main --status success --limit 1 --json headSha -q '.[0].headSha // ""')"
          if [ "$last" = "$GITHUB_SHA" ]; then
            echo "main is still at $GITHUB_SHA, which a nightly run already passed."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build for testing
    needs: nightly-gate
    # The gate is skipped on every event but the schedule, and a skipped need would skip this too.
    if: ${{ !cancelled() && (needs.nightly-gate.result == 'skipped' || needs.nightly-gate.outputs.run == 'true') }}
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app" && xcodebuild -version

      - name: Build
        run: scripts/ci/build-for-testing.sh

      # upload-artifact does not keep file modes, and an .app whose binary lost its execute
      # bit will not launch, so the products travel as a tarball.
      - name: Pack test products
        run: tar -czf test-products.tgz -C "$MINDLORE_DERIVED_DATA" Build/Products

      - uses: actions/upload-artifact@v7
        with:
          name: test-products
          path: test-products.tgz
          retention-days: 1
          if-no-files-found: error

  unit:
    name: Unit tests
    needs: build
    if: inputs.only == '' && inputs.skip_unit != true
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"

      - uses: actions/download-artifact@v8
        with:
          name: test-products

      - name: Unpack test products
        run: mkdir -p "$MINDLORE_DERIVED_DATA" && tar -xzf test-products.tgz -C "$MINDLORE_DERIVED_DATA"

      # No OpenAI key here: the suites that call it run in the live job. The slow tests run at
      # night and when a manual run asks for them.
      - name: Run unit tests
        env:
          TEST_RUNNER_MINDLORE_SLOW: ${{ (github.event_name == 'schedule' || inputs.slow) && '1' || '' }}
        run: scripts/ci/test.sh unit

      - name: Keep the result bundle
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-xcresult
          path: build/results/unit.xcresult
          retention-days: 7

  live:
    name: Live OpenAI tests
    needs: build
    if: github.event_name == 'schedule' || inputs.live
    continue-on-error: ${{ github.event_name != 'schedule' }}
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"

      - uses: actions/download-artifact@v8
        with:
          name: test-products

      - name: Unpack test products
        run: mkdir -p "$MINDLORE_DERIVED_DATA" && tar -xzf test-products.tgz -C "$MINDLORE_DERIVED_DATA"

      - name: Run live OpenAI tests
        env:
          TEST_RUNNER_MINDLORE_OPENAI_KEY: ${{ secrets.MINDLORE_OPENAI_KEY }}
        run: scripts/ci/test.sh live

      - name: Keep the result bundle
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: live-xcresult
          path: build/results/live.xcresult
          retention-days: 7

  ui:
    name: UI tests (shard ${{ matrix.shard }})
    needs: build
    if: github.event_name == 'schedule' || inputs.ui || inputs.only != ''
    continue-on-error: ${{ github.event_name != 'schedule' }}
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # One runner for a manual "only" run, otherwise one per shard (UI_SHARDS).
        shard: ${{ fromJSON(inputs.only != '' && '[1]' || '[1, 2, 3]') }}
    steps:
      - uses: actions/checkout@v7

      - name: Pick this shard's tests
        id: pick
        env:
          ONLY: ${{ inputs.only }}
          SHARD: ${{ matrix.shard }}
        run: |
          if [ -n "$ONLY" ]; then
            classes="$ONLY"
          else
            classes="$(scripts/ci/ui-shards.sh "$UI_SHARDS" --shard "$SHARD")"
          fi
          echo "Shard $SHARD: ${classes:-nothing}"
          echo "classes=$classes" >> "$GITHUB_OUTPUT"

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        if: steps.pick.outputs.classes != ''
        run: sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"

      - uses: actions/download-artifact@v8
        if: steps.pick.outputs.classes != ''
        with:
          name: test-products

      - name: Unpack test products
        if: steps.pick.outputs.classes != ''
        run: mkdir -p "$MINDLORE_DERIVED_DATA" && tar -xzf test-products.tgz -C "$MINDLORE_DERIVED_DATA"

      # The AI UI classes use real OpenAI when the key is present and the app's stub otherwise.
      - name: Run UI tests
        if: steps.pick.outputs.classes != ''
        env:
          TEST_RUNNER_MINDLORE_OPENAI_KEY: ${{ secrets.MINDLORE_OPENAI_KEY }}
        run: scripts/ci/test.sh ui ${{ steps.pick.outputs.classes }}

      - name: Keep the result bundle
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ui-shard-${{ matrix.shard }}-xcresult
          path: build/results/ui-*.xcresult
          retention-days: 7
