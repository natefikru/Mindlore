# Runs the UI suite for a pull request carrying the "ui" label, and the live OpenAI suites for one
# carrying "live": when a label is added, and on every push to a labeled PR after that.
#
# It dispatches CI on the PR's branch with skip_unit, so those jobs run as a run of their own
# (their checks still land on the PR's head commit) while the PR's own run keeps build and unit.
# Why not a "labeled" trigger on ci.yml itself: a run for any other label would skip its jobs, a
# skipped job counts as a passed required check, and Dependabot labels every PR it opens. This job
# runs on Ubuntu, outside the five-job macOS limit, and does nothing for other labels or for a PR
# from a fork (whose branch can't be dispatched here).

name: UI and live on label

on:
  pull_request:
    types: [labeled, synchronize, opened, reopened]

permissions:
  actions: write

jobs:
  dispatch:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      ((github.event.action == 'labeled' && contains(fromJSON('["ui", "live"]'), github.event.label.name)) ||
       (github.event.action != 'labeled' &&
        (contains(github.event.pull_request.labels.*.name, 'ui') ||
         contains(github.event.pull_request.labels.*.name, 'live'))))
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch on ${{ github.head_ref }}
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.head_ref }}
          UI: ${{ contains(github.event.pull_request.labels.*.name, 'ui') }}
          LIVE: ${{ contains(github.event.pull_request.labels.*.name, 'live') }}
        run: |
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH" \
            -f ui="$UI" -f live="$LIVE" -f slow=false -f skip_unit=true
          echo "Dispatched on $BRANCH (ui $UI, live $LIVE); it shows in the PR's checks as its own run."
