# Archive, sign, and upload a build to TestFlight.
#
# Inert until the project is on a paid Apple Developer team. The job is gated on the repository
# variable RELEASE_ENABLED; with it unset, a tag or a manual run does nothing. Turning it on
# takes the values listed under "Placeholders" in docs/remaining-work.md:
#
#   vars.RELEASE_ENABLED                    "true"
#   vars.APPLE_TEAM_ID                      the paid team's ID (the project still carries the
#                                           Personal Team's; DEVELOPMENT_TEAM below overrides it)
#   secrets.APPLE_DISTRIBUTION_P12_BASE64   Apple Distribution certificate + private key, base64
#   secrets.APPLE_DISTRIBUTION_P12_PASSWORD its password
#   secrets.ASC_KEY_ID                      App Store Connect API key ID
#   secrets.ASC_ISSUER_ID                   App Store Connect issuer ID
#   secrets.ASC_API_KEY_P8                  the .p8 contents
#
# The provisioning profile is not a secret here: with the API key, -allowProvisioningUpdates
# lets xcodebuild create or refresh it. The build number is the run number, so TestFlight
# never sees the same one twice; the marketing version stays in the project.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

env:
  XCODE_VERSION: "26.6"

jobs:
  testflight:
    name: TestFlight
    if: vars.RELEASE_ENABLED == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    env:
      ARCHIVE: ${{ github.workspace }}/build/Mindlore.xcarchive
      EXPORT_DIR: ${{ github.workspace }}/build/export
    steps:
      - uses: actions/checkout@v4

      # The runner context is not available in a job's env block, so the temp paths are set here.
      - name: Set temp paths
        run: |
          echo "KEYCHAIN=$RUNNER_TEMP/release.keychain-db" >> "$GITHUB_ENV"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app" && xcodebuild -version

      - name: Import the distribution certificate into a throwaway keychain
        env:
          P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
        run: |
          p12="$RUNNER_TEMP/distribution.p12"
          echo "$P12_BASE64" | base64 --decode > "$p12"
          keychain_password="$(uuidgen)"
          security create-keychain -p "$keychain_password" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$keychain_password" "$KEYCHAIN"
          security import "$p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$p12"

      - name: Install the App Store Connect API key
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          echo "$ASC_API_KEY_P8" > "$ASC_KEY_PATH"
          chmod 600 "$ASC_KEY_PATH"

      - name: Archive
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Mindlore.xcodeproj \
            -scheme Mindlore \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$ARCHIVE" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            | xcbeautify --renderer github-actions

      - name: Export and upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE" \
            -exportPath "$EXPORT_DIR" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            | xcbeautify --renderer github-actions

      - name: Remove the keychain and key
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN" || true
          rm -f "$ASC_KEY_PATH"
